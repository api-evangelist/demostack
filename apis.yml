x-coverage:
  state: covered
  note: >-
    Demostack has a real, reachable machine surface — a first-party remote MCP
    server at https://mcp.demostack.com/mcp with full OAuth 2.1 discovery — plus
    an llms.txt, an RFC 9116 security.txt, a public trust center and a dated
    release-notes changelog. What it does NOT publish is a REST API reference or
    an OpenAPI definition: api.demostack.com answers 200 "Health Check" at the
    root and 403 to every other path, and docs.demostack.com,
    developer.demostack.com and developers.demostack.com do not resolve.
