apis:
  - aid: demostack:demostack-webhooks
    name: Demostack Webhooks
    description: >-
      Demostack webhooks push real-time demo engagement events to any CRM,
      data warehouse, BI tool, or custom HTTP endpoint. Events are fired when
      prospects view, interact with, or complete a demo, enabling automated
      follow-ups, lead scoring updates, and cold-deal flagging. Native
      connectors surface these events directly inside Salesforce, HubSpot,
      and Slack without requiring custom integration work. Demostack publishes
      no webhook payload schema, event-name registry, signing scheme, or
      retry policy on the public web.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.demostack.com/integrations
    baseURL: https://api.demostack.com
    tags:
      - Webhooks
      - CRM Integration
      - Salesforce
      - HubSpot
      - Slack
      - Demo Analytics
    properties:
      - type: Documentation
        url: https://www.demostack.com/integrations
      - type: Webhooks
        url: asyncapi/demostack-events-webhooks.yml
      - type: Website
        url: https://www.demostack.com
  - aid: demostack:demostack-mcp
    name: Demostack MCP
    description: >-
      Demostack MCP is a first-party remote Model Context Protocol server that
      brings demo intelligence into Claude, ChatGPT, Gemini, and any other
      MCP-compatible client. It is a live HTTPS endpoint an MCP client POSTs
      JSON-RPC to at https://mcp.demostack.com/mcp, protected by OAuth 2.1 with
      PKCE and RFC 7591 dynamic client registration, so a client can register
      and authorize itself without a pre-provisioned credential. Demostack
      states it launches with a focused set of questions covering presenter
      activity, prospect engagement, demo performance, content usage, and
      partner adoption. The live tools/list is auth-gated, so tool names and
      input schemas are not published.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.demostack.com/integrations
    baseURL: https://mcp.demostack.com
    tags:
      - MCP
      - AI
      - Agents
      - Demo Analytics
      - OAuth
    properties:
