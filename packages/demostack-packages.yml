description: >-
  Demostack ships no client libraries. No first-party SDK exists on any public
  package registry, and Demostack's own site and help center never link to one —
  consistent with having no public API reference. Integration with Demostack is
  done through its in-product native connectors (Salesforce, HubSpot, Slack), a
  configurable webhook destination, and the remote MCP server, none of which
  require a client library.

