evidence:
  - url: https://www.demostack.com/pricing
    http_status: 200
    finding: >-
      Fetched 2026-08-14. No tier names, no currency amounts, no per-seat or
      per-application rates, and no usage quotas appear in the rendered page.
correction:
  date: '2026-08-14'
  detail: >-
    A previous revision of this file listed four tiers — Standard, Plus, Pro and
    Platinum — with annual prices of roughly $50,000 and $100,000, seat counts
    and per-tier feature lists. None of those tier names or figures appear
    anywhere on demostack.com; they were assembled from third-party pricing
    aggregators, not from the provider. They have been removed. A quote-only
    provider recorded as publishing four priced plans is a false positive, and
    the honest zero is the useful measurement.
